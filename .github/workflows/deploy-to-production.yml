name: Production Deployment

on:
  # Manual only: start it under Actions > Production Deployment > Run workflow
  workflow_dispatch:
    inputs:
      version:
        description: Release to install, for example 1.2.0
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: syp-ahif-2024-25-26/tadeottools

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Check the version number
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a release version: $VERSION"; exit 1; }

      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.3
        env:
          VERSION: ${{ inputs.version }}
        with:
          envs: VERSION
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          script: |
            set -e

            # Navigate to deployment directory
            cd ~/tadeot-tools-201126

            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # The compose file takes the version from .env; stop here if its images don't use it
            touch .env
            sed -i '/^TADEOT_VERSION=/d' .env
            echo "TADEOT_VERSION=$VERSION" >> .env
            test "$(docker compose config --images | grep -c ":$VERSION\$")" -eq 7

            # Pull the images of this release
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:$VERSION
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:$VERSION
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/dashboard:$VERSION
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/feedback:$VERSION
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/registration:$VERSION
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/cashier:$VERSION
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/statistics:$VERSION

            # Back up the database and the visitor photos; migrations run at API
            # startup and can't be undone, so a failed backup stops the deployment
            STAMP=$(date +%Y%m%d-%H%M%S)
            mkdir -p backups
            docker compose exec -T tadeot-postgres sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "backups/tadeot-$STAMP.dump"
            test -s "backups/tadeot-$STAMP.dump"
            tar -czf "backups/photos-$STAMP.tar.gz" photos

            # Keep the 5 newest backups of each kind
            ls -1t backups/tadeot-*.dump | tail -n +6 | xargs -r rm --
            ls -1t backups/photos-*.tar.gz | tail -n +6 | xargs -r rm --

            # Recreate only the containers whose image changed
            docker compose up -d

            # Show status
            docker compose ps
