name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    # A release (GitHub Release with this tag) builds every image as that version
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Find the services whose folder changed, so only their images are built;
  # a release builds all of them, so all seven exist under its version
  changes:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      services: ${{ steps.release.outputs.services || steps.filter.outputs.changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List all services for a release
        id: release
        if: startsWith(github.ref, 'refs/tags/')
        run: echo 'services=["frontend","backend","dashboard","feedback","registration","cashier","statistics"]' >> "$GITHUB_OUTPUT"

      - name: Detect changed services
        id: filter
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: dorny/paths-filter@v3
        with:
          # filter name = image name; the folder is resolved in build-and-push
          filters: |
            frontend:
              - 'guide/**'
              - '.github/workflows/docker-build-push-images.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/docker-build-push-images.yml'
            dashboard:
              - 'dashboard/**'
              - '.github/workflows/docker-build-push-images.yml'
            feedback:
              - 'kiosk/feedback/**'
              - '.github/workflows/docker-build-push-images.yml'
            registration:
              - 'kiosk/registration/**'
              - '.github/workflows/docker-build-push-images.yml'
            cashier:
              - 'kiosk/cashier/**'
              - '.github/workflows/docker-build-push-images.yml'
            statistics:
              - 'kiosk/statistics/**'
              - '.github/workflows/docker-build-push-images.yml'

  build-and-push:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest

    # Set permissions for GITHUB_TOKEN
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        # one entry per image name; each image has its own folder with a Dockerfile
        service: ${{ fromJSON(needs.changes.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # git describe needs the history and the tags
          fetch-depth: 0

      # 1.2.0 on a release, 1.2.0-5-gabc1234 five commits after it on main
      - name: Resolve version
        id: version
        run: echo "version=$(git describe --tags --match 'v[0-9]*' --always | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      # image names stay as before so the VM compose files keep working
      - name: Resolve source folder
        id: folder
        run: |
          case "${{ matrix.service }}" in
            frontend) echo "path=guide" >> "$GITHUB_OUTPUT" ;;
            feedback) echo "path=kiosk/feedback" >> "$GITHUB_OUTPUT" ;;
            registration) echo "path=kiosk/registration" >> "$GITHUB_OUTPUT" ;;
            cashier) echo "path=kiosk/cashier" >> "$GITHUB_OUTPUT" ;;
            statistics) echo "path=kiosk/statistics" >> "$GITHUB_OUTPUT" ;;
            *)        echo "path=${{ matrix.service }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
          # latest follows main (staging); a release only gets its version tag
          flavor: |
            latest=false

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./${{ steps.folder.outputs.path }}
          file: ./${{ steps.folder.outputs.path }}/Dockerfile
          # the VMs are x86_64
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          # separate cache per service, otherwise the matrix jobs overwrite each other's cache
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
