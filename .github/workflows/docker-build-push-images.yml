name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Find the services whose folder changed, so only their images are built
  changes:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      services: ${{ steps.filter.outputs.changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # filter name = image name; the folder is resolved in build-and-push
          filters: |
            frontend:
              - 'guide/**'
              - '.github/workflows/docker-build-push-images.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/docker-build-push-images.yml'
            dashboard:
              - 'dashboard/**'
              - '.github/workflows/docker-build-push-images.yml'
            feedback:
              - 'kiosk/feedback/**'
              - '.github/workflows/docker-build-push-images.yml'
            registration:
              - 'kiosk/registration/**'
              - '.github/workflows/docker-build-push-images.yml'

  build-and-push:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest

    # Set permissions for GITHUB_TOKEN
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        # one entry per image name; each image has its own folder with a Dockerfile
        service: ${{ fromJSON(needs.changes.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # image names stay as before so the VM compose files keep working
      - name: Resolve source folder
        id: folder
        run: |
          case "${{ matrix.service }}" in
            frontend) echo "path=guide" >> "$GITHUB_OUTPUT" ;;
            feedback) echo "path=kiosk/feedback" >> "$GITHUB_OUTPUT" ;;
            registration) echo "path=kiosk/registration" >> "$GITHUB_OUTPUT" ;;
            *)        echo "path=${{ matrix.service }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=auto

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./${{ steps.folder.outputs.path }}
          file: ./${{ steps.folder.outputs.path }}/Dockerfile
          # the VMs are x86_64
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # separate cache per service, otherwise the matrix jobs overwrite each other's cache
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
