<div class="min-h-screen">
  <div class="container mx-auto px-4 py-8">
    <!-- Header -->
    <header class="mb-8">
      <h1 class="text-center text-2xl font-bold text-text-950 md:text-left">
        Feedback
      </h1>
      <!-- Questions edit the form; Responses reads what visitors sent. The tab is in the URL so other pages can link to it. -->
      <div
        role="tablist"
        aria-label="Feedback"
        class="tabs tabs-bordered mt-6 w-fit"
      >
        <a
          role="tab"
          class="tab"
          [class.tab-active]="tab() === 'questions'"
          [attr.aria-selected]="tab() === 'questions'"
          routerLink="."
          [queryParams]="{ tab: null }"
          queryParamsHandling="merge"
          replaceUrl
          >Questions</a
        >
        <a
          role="tab"
          class="tab gap-2"
          [class.tab-active]="tab() === 'responses'"
          [attr.aria-selected]="tab() === 'responses'"
          routerLink="."
          [queryParams]="{ tab: 'responses' }"
          queryParamsHandling="merge"
          replaceUrl
        >
          Responses
          @if (responses(); as r) {
            <span class="badge badge-sm tabular-nums">{{
              r.responseCount
            }}</span>
          }
        </a>
      </div>
      @if (tab() === 'questions') {
        <!-- The actions for the questions live in their tab. -->
        <div class="mt-6 flex flex-wrap justify-end gap-3">
          <button (click)="togglePreview()" class="btn btn-primary">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="mr-1 h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
              />
            </svg>
            {{ isPreviewMode() ? 'Exit Preview' : 'Preview Form' }}
          </button>
          <button
            (click)="saveQuestions()"
            class="btn btn-primary"
            [disabled]="saving()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="mr-1 h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"
              />
            </svg>
            Save Changes
          </button>
        </div>
      }
    </header>

    @if (tab() === 'questions') {
      <!-- Preview Mode -->
      @if (isPreviewMode()) {
        <app-feedback-preview [questions]="questions()" />
      }

      <!-- Questions Management -->
      @if (!isPreviewMode()) {
        <app-feedback-question-list
          [questions]="questions()"
          (addQuestion)="addNewQuestion()"
          (editQuestion)="editQuestion($event)"
          (deleteQuestion)="deleteQuestion($event)"
          (reorderQuestions)="drop($event)"
        />
      }

      <!-- Question Editor Modal -->
      @if (showQuestionEditor()) {
        <app-feedback-question-editor
          [questionForm]="questionForm"
          [editingIndex]="editingIndex()"
          [allQuestions]="questions()"
          (save)="saveQuestion()"
          (cancel)="closeQuestionEditor()"
        />
      }
    } @else {
      <app-feedback-responses
        [responses]="responses()"
        [questions]="questions()"
        [loading]="responsesLoading()"
        [failed]="responsesFailed()"
        (reload)="loadResponses()"
        (showQuestions)="showTab('questions')"
      />
    }

    @if (confirmingDeletedAnswers(); as affected) {
      <app-delete-popup
        title="Save and delete answers?"
        [message]="affected.message"
        [confirmLabel]="affected.confirmLabel"
        secondaryLabel="Download CSV"
        [busy]="saving()"
        (secondary)="downloadCsv()"
        (removeConfirmed)="saveQuestions(true)"
        (cancel)="confirmingDeletedAnswers.set(null)"
      />
    }
  </div>
</div>
