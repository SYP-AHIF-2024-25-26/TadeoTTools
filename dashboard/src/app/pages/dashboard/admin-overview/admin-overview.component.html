<div class="flex flex-col">
  <div class="w-full max-w-xl">
    <label for="addname" class="mb-1 block text-sm font-medium">
      Add an admin by EduFS username
    </label>
    <div class="mb-4 flex items-center gap-2">
      <input
        class="input input-bordered flex-1"
        type="text"
        [value]="addname()"
        [(ngModel)]="addname"
        name="addname"
        placeholder="EduFS username, e.g. if123456"
        id="addname"
      />
      <button (click)="addAdmin()" class="btn btn-primary btn-sm">
        Add Admin
      </button>
    </div>
  </div>

  <div class="mt-4 w-full max-w-xl">
    @if (errorMessage()) {
      <div role="alert" class="alert alert-error mb-4">
        {{ errorMessage() }}
      </div>
    }
    @for (admin of admins(); track $index) {
      <div
        class="mb-4 flex items-center justify-between rounded-lg bg-background-100 p-4 shadow-lg shadow-secondary-200 dark:border dark:border-accent-400"
      >
        <div class="text-lg font-semibold">{{ admin }}</div>
        @if (isCurrentUser(admin)) {
          <span class="text-sm text-ink-muted"> That's you </span>
        } @else {
          <button
            (click)="adminToDelete.set(admin)"
            class="btn btn-outline btn-error btn-sm"
          >
            Remove
          </button>
        }
      </div>
    }
  </div>
</div>

@if (adminToDelete(); as name) {
  <app-delete-popup
    title="Remove Admin"
    [message]="name + ' will lose admin access to the dashboard.'"
    confirmLabel="Remove Admin"
    [busy]="deleting()"
    (cancel)="adminToDelete.set(null)"
    (removeConfirmed)="deleteAdmin()"
  />
}
