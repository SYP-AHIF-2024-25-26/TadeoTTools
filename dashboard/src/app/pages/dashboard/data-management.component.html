<div class="page-shell">
  <app-page-header title="Users & Data" />

  <!-- The tab is in the URL so other pages can link to it (e.g. ?tab=data). -->
  <div role="tablist" aria-label="Users & Data" class="page-tabs">
    <a
      role="tab"
      class="page-tab"
      [attr.aria-selected]="activeTab() === 'stop-managers'"
      routerLink="."
      [queryParams]="{ tab: null }"
      queryParamsHandling="merge"
      replaceUrl
      >Stop Managers</a
    >
    <a
      role="tab"
      class="page-tab"
      [attr.aria-selected]="activeTab() === 'admins'"
      routerLink="."
      [queryParams]="{ tab: 'admins' }"
      queryParamsHandling="merge"
      replaceUrl
      >Admins</a
    >
    <a
      role="tab"
      class="page-tab"
      [attr.aria-selected]="activeTab() === 'data'"
      routerLink="."
      [queryParams]="{ tab: 'data' }"
      queryParamsHandling="merge"
      replaceUrl
      >Import &amp; Export</a
    >
  </div>

  <!-- Tab Content -->
  <div>
    @if (activeTab() === 'stop-managers') {
      <app-stop-manager-overview />
    } @else if (activeTab() === 'admins') {
      <app-admin-overview />
    } @else if (activeTab() === 'data') {
      <app-data-page />
    }
  </div>
</div>
