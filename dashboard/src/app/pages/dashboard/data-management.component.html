<div class="page-shell">
  <app-page-header title="Users & Data" />

  <!-- Horizontal Tab Navigation -->
  <div class="mb-6 border-b border-background-300 dark:border-background-700">
    <div class="flex gap-2">
      <button
        class="rounded-t-lg px-6 py-3 text-sm text-ink transition-all duration-200"
        [class.font-bold]="activeTab() === 'stop-managers'"
        (click)="activeTab.set('stop-managers')"
      >
        Stop Managers
      </button>

      <button
        class="rounded-t-lg px-6 py-3 text-sm text-ink transition-all duration-200"
        [class.font-bold]="activeTab() === 'admins'"
        (click)="activeTab.set('admins')"
      >
        Admins
      </button>

      <button
        class="rounded-t-lg px-6 py-3 text-sm text-ink transition-all duration-200"
        [class.font-bold]="activeTab() === 'data'"
        (click)="activeTab.set('data')"
      >
        Import &amp; Export
      </button>
    </div>
  </div>

  <!-- Tab Content -->
  <div>
    @if (activeTab() === 'stop-managers') {
      <app-stop-manager-overview />
    } @else if (activeTab() === 'admins') {
      <app-admin-overview />
    } @else if (activeTab() === 'data') {
      <app-data-page />
    }
  </div>
</div>
