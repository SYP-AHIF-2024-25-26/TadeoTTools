<div class="page-shell">
  <app-page-header title="Users & Data" />

  <!-- The tab is in the URL so other pages can link to it (e.g. ?tab=students). -->
  <div role="tablist" aria-label="Users & Data" class="page-tabs">
    <a
      role="tab"
      class="page-tab"
      [attr.aria-selected]="activeTab() === 'stop-managers'"
      routerLink="."
      [queryParams]="{ tab: null }"
      queryParamsHandling="merge"
      replaceUrl
      >Stop Managers</a
    >
    <a
      role="tab"
      class="page-tab"
      [attr.aria-selected]="activeTab() === 'admins'"
      routerLink="."
      [queryParams]="{ tab: 'admins' }"
      queryParamsHandling="merge"
      replaceUrl
      >Admins</a
    >
    <a
      role="tab"
      class="page-tab"
      [attr.aria-selected]="activeTab() === 'students'"
      routerLink="."
      [queryParams]="{ tab: 'students' }"
      queryParamsHandling="merge"
      replaceUrl
      >Students</a
    >
    <a
      role="tab"
      class="page-tab"
      [attr.aria-selected]="activeTab() === 'divisions'"
      routerLink="."
      [queryParams]="{ tab: 'divisions' }"
      queryParamsHandling="merge"
      replaceUrl
      >Divisions</a
    >
    <a
      role="tab"
      class="page-tab"
      [attr.aria-selected]="activeTab() === 'visitor-app'"
      routerLink="."
      [queryParams]="{ tab: 'visitor-app' }"
      queryParamsHandling="merge"
      replaceUrl
      >Visitor App</a
    >
  </div>

  <div role="tabpanel">
    @switch (activeTab()) {
      @case ('stop-managers') {
        <app-stop-manager-overview />
      }
      @case ('admins') {
        <app-admin-overview />
      }
      @case ('students') {
        <app-students-data />
      }
      @case ('divisions') {
        <app-divisions-list />
      }
      @case ('visitor-app') {
        <app-visitor-app-settings />
      }
    }
  </div>
</div>
