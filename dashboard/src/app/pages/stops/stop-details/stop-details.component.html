<div
  class="mx-auto mt-4 w-full max-w-5xl rounded-lg bg-background-100 p-4 shadow-lg sm:p-6 md:mt-10"
>
  @if (stop().id == -1) {
    <h4 class="text-xl text-text-950">New Stop</h4>
  } @else {
    <h4 class="text-xl text-text-950">Edit Stop</h4>
  }
  @if (isLoading()) {
    <div class="flex h-32 items-center justify-center">
      <app-loader></app-loader>
    </div>
  } @else {
    <form (submit)="submitStopDetail()" class="mt-4">
      <app-stop-general-info [(stop)]="stop" />

      <!--<app-stop-groups
        [(stop)]="stop"
        [stopGroups]="stopGroups()"
        [isAdmin]="isAdmin()"
      />-->

      <app-stop-students [(stop)]="stop" [students]="students()" />

      <app-stop-managers
        [(stop)]="stop"
        [stopManagers]="stopManagers()"
        [isAdmin]="isAdmin()"
      />

      <app-stop-divisions
        [(stop)]="stop"
        [divisions]="divisions()"
        [isAdmin]="isAdmin()"
      />

      <div
        class="sticky bottom-0 z-10 -mx-4 mt-6 border-t border-background-200 bg-background-100 px-4 py-3 dark:border-background-600 sm:-mx-6 sm:px-6"
      >
        @if (errorMessage() != null) {
          <p role="alert" class="mb-2 text-sm font-medium text-error">
            {{ errorMessage() }}
          </p>
        }
        <div class="flex flex-wrap items-center gap-2">
          <button
            type="submit"
            class="btn btn-primary btn-sm gap-2"
            [disabled]="saving() || !hasUnsavedChanges()"
          >
            @if (saving()) {
              <span class="loading loading-spinner loading-xs"></span>
              Saving…
            } @else if (stop().id == -1) {
              Create Stop
            } @else {
              Save Changes
            }
          </button>
          <button
            (click)="goBack()"
            type="button"
            class="btn btn-ghost btn-sm"
            [disabled]="saving()"
          >
            Cancel
          </button>
          @if (hasUnsavedChanges() && !saving()) {
            <span class="text-sm font-medium text-text-700 dark:text-text-300">
              Unsaved changes
            </span>
          }
          @if (isAdmin() && stop().id != -1) {
            <button
              (click)="showDeleteConfirm.set(true)"
              type="button"
              class="btn btn-error btn-sm ml-auto gap-2"
              [disabled]="saving()"
            >
              Delete
            </button>
          }
        </div>
      </div>
    </form>
  }
</div>

@if (showDeleteConfirm()) {
  <app-delete-popup
    title="Delete stop"
    [message]="deleteMessage()"
    confirmLabel="Delete stop"
    [busy]="deleting()"
    (cancel)="showDeleteConfirm.set(false)"
    (removeConfirmed)="deleteAndGoBack()"
  />
}
