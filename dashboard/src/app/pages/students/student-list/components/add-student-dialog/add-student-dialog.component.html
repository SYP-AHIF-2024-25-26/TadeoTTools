<app-dialog title="Add Student" (close)="close.emit()">
  @if (addStudentError()) {
    <div class="alert alert-error mb-4" role="alert">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6 shrink-0 stroke-current"
        fill="none"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M12 8v.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
        />
      </svg>
      <span>{{ addStudentError() }}</span>
    </div>
  }

  <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
    <div class="form-control md:col-span-2">
      <label for="new-student-username" class="label"
        ><span class="label-text"
          >EduFS Username <span aria-hidden="true">*</span></span
        ></label
      >
      <input
        id="new-student-username"
        required
        class="input input-bordered w-full"
        [(ngModel)]="newStudent.edufsUsername"
        placeholder="e.g. if123456"
      />
    </div>
    <div class="form-control">
      <label for="new-student-first-name" class="label"
        ><span class="label-text"
          >First Name <span aria-hidden="true">*</span></span
        ></label
      >
      <input
        id="new-student-first-name"
        required
        class="input input-bordered w-full"
        [(ngModel)]="newStudent.firstName"
      />
    </div>
    <div class="form-control">
      <label for="new-student-last-name" class="label"
        ><span class="label-text"
          >Last Name <span aria-hidden="true">*</span></span
        ></label
      >
      <input
        id="new-student-last-name"
        required
        class="input input-bordered w-full"
        [(ngModel)]="newStudent.lastName"
      />
    </div>
    <div class="form-control">
      <label for="new-student-class" class="label"
        ><span class="label-text"
          >Class <span aria-hidden="true">*</span></span
        ></label
      >
      <input
        id="new-student-class"
        required
        class="input input-bordered w-full"
        [(ngModel)]="newStudent.studentClass"
        placeholder="e.g. 5AHIF"
      />
    </div>
    <div class="form-control">
      <label for="new-student-department" class="label"
        ><span class="label-text"
          >Department <span aria-hidden="true">*</span></span
        ></label
      >
      <select
        id="new-student-department"
        required
        class="select select-bordered w-full"
        [(ngModel)]="newStudent.department"
      >
        <option value="">Select department</option>
        @for (dep of uniqueDepartments(); track dep) {
          <option [value]="dep">{{ dep }}</option>
        }
      </select>
    </div>
  </div>

  <div dialog-actions class="contents">
    <button class="btn btn-ghost btn-sm" (click)="close.emit()">Cancel</button>
    <button
      class="btn btn-primary btn-sm"
      (click)="saveNewStudent()"
      [disabled]="
        !newStudent.edufsUsername ||
        !newStudent.firstName ||
        !newStudent.lastName ||
        !newStudent.studentClass ||
        !newStudent.department
      "
    >
      Add Student
    </button>
  </div>
</app-dialog>
