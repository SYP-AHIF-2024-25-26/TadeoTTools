<div class="flex flex-col gap-4 md:flex-row md:items-end">
  <div
    class="grid flex-1 grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5"
  >
    <div class="form-control">
      <label for="student-filter-search" class="label">
        <span class="label-text">Search</span>
      </label>
      <input
        id="student-filter-search"
        type="text"
        placeholder="Search by (user)name"
        class="field-filter input input-bordered w-full"
        [(ngModel)]="searchTerm"
      />
    </div>

    <div class="form-control">
      <label for="student-filter-class" class="label">
        <span class="label-text">Class</span>
      </label>
      <select
        id="student-filter-class"
        class="field-filter select select-bordered w-full"
        [(ngModel)]="classFilter"
      >
        <option value="">All Classes</option>
        @for (className of filteredUniqueClasses(); track className) {
          <option [value]="className">{{ className }}</option>
        }
      </select>
    </div>

    <div class="form-control">
      <label for="student-filter-department" class="label">
        <span class="label-text">Division</span>
      </label>
      <select
        id="student-filter-department"
        class="field-filter select select-bordered w-full"
        [(ngModel)]="departmentFilter"
      >
        <option value="">All Divisions</option>
        @for (dep of uniqueDepartments(); track dep) {
          <option [value]="dep">{{ dep }}</option>
        }
      </select>
    </div>

    <div class="form-control">
      <label for="student-filter-stop" class="label">
        <span class="label-text">Stop</span>
      </label>
      <select
        id="student-filter-stop"
        class="field-filter select select-bordered w-full"
        [(ngModel)]="stopFilter"
      >
        <option value="">All Stops</option>
        @for (stopName of uniqueStops(); track stopName) {
          <option [value]="stopName">{{ stopName }}</option>
        }
      </select>
    </div>

    <div class="form-control">
      <label for="student-filter-status" class="label">
        <span class="label-text">Status</span>
      </label>
      <select
        id="student-filter-status"
        class="field-filter select select-bordered w-full"
        [(ngModel)]="statusFilter"
      >
        <option value="all">All</option>
        <option value="unassigned">Unassigned</option>
        <option value="conflict">Conflicts</option>
        <option value="pending">Pending</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected (old)</option>
      </select>
    </div>
  </div>
</div>
