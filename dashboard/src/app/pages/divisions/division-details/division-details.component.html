<app-dialog
  [title]="id() === -1 ? 'New Division' : 'Edit Division'"
  [busy]="saving()"
  (close)="onEscape()"
>
  <!-- Error Message -->
  @if (errorMessage()) {
    <div role="alert" class="alert alert-error mb-4">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6 shrink-0 stroke-current"
        fill="none"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"
        />
      </svg>
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <!-- Form -->
  <form
    id="division-form"
    (ngSubmit)="submitDivisionDetail()"
    class="space-y-4"
  >
    <!-- Division Name -->
    <div class="form-control">
      <label class="label" for="name">
        <span class="label-text"
          >Division Name <span aria-hidden="true">*</span></span
        >
      </label>
      <input
        type="text"
        id="name"
        required
        maxlength="50"
        placeholder="e.g. Informatik"
        class="input input-bordered w-full"
        [(ngModel)]="name"
        name="name"
      />
    </div>

    <!-- Division Color -->
    <div class="form-control">
      <label class="label" for="color">
        <span class="label-text">Color <span aria-hidden="true">*</span></span>
      </label>
      <div class="flex items-center gap-4">
        <input
          type="color"
          id="color"
          class="input input-bordered h-12 w-24 p-1"
          [(ngModel)]="color"
          name="color"
        />
        <div
          class="h-12 w-24 rounded-lg border border-base-300"
          [style.backgroundColor]="color()"
        ></div>
      </div>
    </div>

    <!-- File Upload -->
    <div class="form-control">
      <label class="label" for="file">
        <span class="label-text">Division Image (SVG, PNG, JPG)</span>
      </label>
      <input
        type="file"
        id="file"
        (change)="onFileChange($event)"
        class="file-input file-input-bordered w-full"
        accept="image/jpeg,image/png,image/svg+xml"
      />
    </div>

    <!-- Image Preview -->
    @if (filePreview()) {
      <div class="mt-4">
        <label class="label"
          ><span class="label-text">New Image Preview:</span></label
        >
        <div class="flex items-center gap-4">
          <img
            [src]="filePreview()"
            alt="Image Preview"
            class="h-20 w-20 rounded-lg border border-base-300 object-cover"
          />
          <button
            type="button"
            (click)="clearPreview()"
            class="btn btn-ghost btn-sm"
          >
            Discard
          </button>
        </div>
      </div>
    } @else if (id() !== -1 && !imageDeleted()) {
      <div class="mt-4">
        <label class="label"
          ><span class="label-text">Current Image:</span></label
        >
        <div class="flex items-center gap-4">
          <img
            [src]="baseUrl + '/divisions/' + id() + '/image'"
            alt="Current Division Image"
            class="h-20 w-20 rounded-lg border border-base-300 object-cover"
          />
          <button
            type="button"
            (click)="confirmAction.set('image')"
            class="btn btn-outline btn-error btn-sm"
          >
            Delete Image
          </button>
        </div>
      </div>
    }
  </form>

  <div dialog-actions class="contents">
    @if (id() !== -1) {
      <button
        type="button"
        (click)="confirmAction.set('division')"
        class="btn btn-outline btn-error btn-sm mr-auto"
      >
        Delete Division
      </button>
    }
    <button type="button" (click)="cancelPopup()" class="btn btn-ghost btn-sm">
      Cancel
    </button>
    <button
      type="submit"
      form="division-form"
      class="btn btn-primary btn-sm"
      [disabled]="saving()"
    >
      {{ id() === -1 ? 'Create Division' : 'Save Changes' }}
    </button>
  </div>
</app-dialog>

@if (confirmAction() === 'division') {
  <app-delete-popup
    title="Delete Division"
    [message]="deleteDivisionMessage()"
    confirmLabel="Delete Division"
    [busy]="deleting()"
    (cancel)="confirmAction.set(null)"
    (removeConfirmed)="deleteAndGoBack()"
  />
} @else if (confirmAction() === 'image') {
  <app-delete-popup
    title="Delete Image"
    [message]="deleteImageMessage()"
    confirmLabel="Delete Image"
    [busy]="deleting()"
    (cancel)="confirmAction.set(null)"
    (removeConfirmed)="deleteImage()"
  />
}
