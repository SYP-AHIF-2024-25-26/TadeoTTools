<div class="page-shell">
  <app-page-header title="Divisions">
    <button class="btn btn-primary btn-sm" (click)="showDivisionPopUp(-1)">
      Add Division
    </button>
  </app-page-header>
  <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">
    @for (division of divisions(); track $index) {
      <div
        class="flex flex-col flex-wrap justify-between rounded-lg bg-background-100 p-6 shadow-lg shadow-secondary-200 dark:border dark:border-accent-400"
      >
        <div class="flex flex-nowrap justify-evenly">
          <div class="flex w-3/4">
            <p class="font-bold text-ink">{{ division.name }}</p>
          </div>
          <div
            class="m-auto h-8 w-8 self-end justify-self-end rounded-md"
            [style.background-color]="division.color"
          ></div>
        </div>
        <img
          class="h-32 w-32 object-cover"
          [src]="
            baseUrl + '/divisions/' + division.id + '/image?v=' + imageVersion()
          "
          [alt]="division.name"
          (error)="hideImage($event)"
        />
        <div class="flex">
          <button
            class="btn btn-primary mb-1 mt-4 shadow-lg"
            (click)="showDivisionPopUp(division.id)"
          >
            Edit
          </button>
          <button
            class="btn btn-outline btn-error my-1 ml-auto mt-4 shadow-lg"
            (click)="deleteDivision(division)"
          >
            Delete
          </button>
        </div>
      </div>
    }
  </div>
</div>

@if (showDivisionDetailPopUp()) {
  <app-division-details
    [id]="divisionIdDetail"
    (cancel)="handleDivisionPopupClose()"
    (close)="handleDivisionPopupClose()"
  />
}
