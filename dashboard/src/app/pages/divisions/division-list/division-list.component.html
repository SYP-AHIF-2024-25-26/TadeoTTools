<div class="page-shell">
  <app-page-header title="Divisions">
    <button class="btn btn-primary btn-sm" (click)="showDivisionPopUp(-1)">
      Add Division
    </button>
  </app-page-header>
  <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">
    @for (division of divisions(); track $index) {
      <div
        class="flex flex-col rounded-lg bg-background-100 p-6 shadow-lg shadow-secondary-200 dark:border dark:border-accent-400"
      >
        <div class="flex items-center gap-3">
          <div
            class="h-8 w-8 shrink-0 rounded-md"
            [style.background-color]="division.color"
            aria-hidden="true"
          ></div>
          <h2 class="min-w-0 flex-1 break-words font-bold">
            {{ division.name }}
          </h2>
          <div class="flex shrink-0 gap-1">
            <button
              type="button"
              class="btn btn-ghost btn-sm"
              [attr.aria-label]="'Edit ' + division.name"
              title="Edit"
              (click)="showDivisionPopUp(division.id)"
            >
              <app-action-icon name="edit" />
            </button>
            <button
              type="button"
              class="btn btn-ghost btn-sm text-error"
              [attr.aria-label]="'Delete ' + division.name"
              title="Delete"
              (click)="deleteDivision(division)"
            >
              <app-action-icon name="delete" />
            </button>
          </div>
        </div>
        <img
          class="mt-4 h-32 w-32 object-cover"
          [src]="
            baseUrl + '/divisions/' + division.id + '/image?v=' + imageVersion()
          "
          [alt]="division.name"
          (error)="hideImage($event)"
        />
      </div>
    }
  </div>
</div>

@if (showDivisionDetailPopUp()) {
  <app-division-details
    [id]="divisionIdDetail"
    (cancel)="handleDivisionPopupClose()"
    (close)="handleDivisionPopupClose()"
  />
}
