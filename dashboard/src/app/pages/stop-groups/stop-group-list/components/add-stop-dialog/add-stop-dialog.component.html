<app-dialog title="Add Stop" size="md" (close)="close.emit()">
  @if (stops().length === 0) {
    <p class="py-8 text-center text-sm text-ink-muted">
      No available stops to add.
    </p>
  } @else {
    <ul class="space-y-1">
      @for (stop of stops(); track stop.id) {
        <li>
          <button
            type="button"
            (click)="addStop.emit(stop.id)"
            class="w-full rounded-lg p-3 text-left text-sm font-medium transition-colors hover:bg-background-200 dark:hover:bg-background-700"
          >
            {{ stop.name }}
          </button>
        </li>
      }
    </ul>
  }
</app-dialog>
