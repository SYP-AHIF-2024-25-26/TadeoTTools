<!-- The tour's save bar: stays under the nav while the groups are reordered -->
<div
  class="-mx-2 mb-4 flex flex-wrap items-center justify-between gap-3 rounded-lg bg-background-100 px-2 py-3 md:sticky md:top-16 md:z-10"
>
  <label class="label cursor-pointer gap-2">
    <input
      (click)="togglePublicGroups.emit()"
      type="checkbox"
      class="toggle toggle-primary toggle-sm"
      id="only-public-groups"
      [checked]="!onlyPublicGroups()"
    />
    <span class="label-text text-sm">Show Private Groups</span>
  </label>

  <div class="flex flex-wrap items-center gap-2">
    @if (hasChanged() && !saving()) {
      <span class="text-sm font-medium">Unsaved changes</span>
    }
    <button
      (click)="cancel.emit()"
      [disabled]="!hasChanged() || saving()"
      class="btn btn-ghost btn-sm"
    >
      Cancel
    </button>
    <button
      (click)="save.emit()"
      [disabled]="!hasChanged() || saving()"
      class="btn btn-primary btn-sm"
    >
      @if (saving()) {
        <span class="loading loading-spinner loading-xs"></span>
        Saving…
      } @else {
        Save Changes
      }
    </button>
  </div>
</div>
