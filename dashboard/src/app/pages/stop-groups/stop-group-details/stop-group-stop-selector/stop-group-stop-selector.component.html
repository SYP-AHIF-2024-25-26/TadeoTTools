<div class="mt-6">
  <h2 class="mb-4 text-lg font-bold">Stops</h2>

  <div class="mb-4 flex gap-2">
    <select
      [(ngModel)]="selectedStopId"
      aria-label="Stop to add"
      class="select select-bordered w-full"
    >
      <option [value]="-1" disabled selected>Select a stop to add</option>
      @for (stop of availableStops(); track stop.id) {
        <option [value]="stop.id">{{ stop.name }}</option>
      }
    </select>
    <button
      type="button"
      (click)="addStop()"
      [disabled]="selectedStopId === -1"
      class="btn btn-outline btn-sm self-center"
    >
      Add
    </button>
  </div>

  <div
    cdkDropList
    (cdkDropListDropped)="drop($event)"
    class="flex flex-col gap-2 rounded-lg border border-primary-200 bg-background-50 p-4 dark:border-background-700 dark:bg-background-800"
  >
    @for (
      stop of includedStops();
      track stop.id;
      let i = $index, first = $first, last = $last
    ) {
      <div
        cdkDrag
        class="flex cursor-move items-center justify-between rounded-md border border-primary-100 bg-white p-3 shadow-sm hover:bg-primary-50 dark:border-background-600 dark:bg-background-700 dark:hover:bg-background-600"
      >
        <span class="text-ink">{{ stop.name }}</span>
        <div class="flex items-center gap-1">
          <button
            type="button"
            class="btn btn-ghost btn-xs"
            [attr.aria-label]="'Move ' + stop.name + ' up'"
            [disabled]="first"
            (click)="moveStop(i, -1)"
          >
            <svg
              class="h-4 w-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 15l7-7 7 7"
              />
            </svg>
          </button>
          <button
            type="button"
            class="btn btn-ghost btn-xs"
            [attr.aria-label]="'Move ' + stop.name + ' down'"
            [disabled]="last"
            (click)="moveStop(i, 1)"
          >
            <svg
              class="h-4 w-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              />
            </svg>
          </button>
          <button
            type="button"
            [attr.aria-label]="'Remove ' + stop.name"
            (click)="removeStop(stop.id)"
            class="text-red-600 hover:text-red-800 dark:text-red-400 dark:hover:text-red-300"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="h-5 w-5"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
      </div>
    }
    @if (includedStops().length === 0) {
      <div class="py-4 text-center text-sm text-ink-muted">
        No stops added yet. Select a stop above to add it.
      </div>
    }
  </div>
</div>
