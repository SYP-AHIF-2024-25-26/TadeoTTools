<app-dialog
  [title]="title()"
  size="md"
  [role]="tone() === 'danger' ? 'alertdialog' : 'dialog'"
  [busy]="busy()"
  (close)="cancel.emit()"
>
  <p class="whitespace-pre-line">{{ message() }}</p>

  @if (confirmText()) {
    <label class="mt-4 block text-sm">
      Type <strong class="font-semibold">{{ confirmText() }}</strong> to confirm
      <input
        type="text"
        class="input input-sm input-bordered mt-2 w-full"
        autocomplete="off"
        [value]="typed()"
        (input)="typed.set($any($event.target).value)"
        (keydown.enter)="confirmRemove()"
      />
    </label>
  }

  <div dialog-actions class="contents">
    @if (secondaryLabel()) {
      <button
        type="button"
        class="btn btn-outline btn-sm mr-auto"
        [disabled]="busy()"
        (click)="secondary.emit()"
      >
        {{ secondaryLabel() }}
      </button>
    }
    <!-- Start on the safe choice. -->
    <button
      cdkFocusInitial
      type="button"
      class="btn btn-ghost btn-sm"
      [disabled]="busy()"
      (click)="cancelPopup()"
    >
      {{ cancelLabel() }}
    </button>
    <button
      type="button"
      class="btn btn-sm"
      [class.btn-error]="tone() === 'danger'"
      [class.btn-primary]="tone() === 'primary'"
      [disabled]="!canConfirm()"
      (click)="confirmRemove()"
    >
      @if (busy()) {
        <span class="loading loading-spinner loading-xs"></span>
      }
      {{ confirmLabel() }}
    </button>
  </div>
</app-dialog>
