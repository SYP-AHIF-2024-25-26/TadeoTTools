<div class="nav-surface sticky top-0 z-50 border-b border-primary-200 bg-primary-100 shadow-sm dark:border-background-600 dark:bg-background-400">
  <nav
    class="mx-auto flex max-w-screen-xl items-center justify-between p-4 text-ink"
  >
    <!-- Logo -->
    <!-- Admins: the Overview (their home); everyone else: their own start page -->
    <a
      [routerLink]="isAdmin() ? ['/overview'] : ['/']"
      [attr.aria-label]="isAdmin() ? 'Overview' : 'Home'"
      [attr.aria-current]="isAdmin() && path() === '/overview' ? 'page' : null"
      class="flex items-center"
    >
      <!-- The school's colour logo on the pale bar; the white one on the dark bar -->
      <img
        ngSrc="assets/htl-leonding-logo.png"
        priority
        alt="HTL Leonding"
        class="h-8 w-auto dark:hidden"
        height="347"
        width="1536"
      />
      <img
        ngSrc="assets/Leonding_Logo.svg"
        priority
        alt="HTL Leonding"
        class="hidden h-8 w-auto dark:block"
        height="29"
        width="128"
      />
    </a>

    <!-- Nav Links (desktop) -->
    <div class="hidden space-x-4 md:flex md:items-center md:justify-start">
      @if (isAdmin()) {
        @for (link of navLinks; track link.route) {
          <a
            class="px-3 py-2"
            [class]="
              isActive(link)
                ? 'bg-primary rounded font-medium text-primary-content underline'
                : ''
            "
            [routerLink]="[link.route]"
            [attr.aria-current]="isActive(link) ? 'page' : null"
          >
            {{ link.label }}
          </a>
        }
      }
    </div>

    <div class="flex items-center space-x-4">
      <label class="inline-flex cursor-pointer items-center">
        <input
          type="checkbox"
          class="peer sr-only"
          aria-label="Dark mode"
          [checked]="!isWhiteMode()"
          (click)="changeDarkMode()"
        />
        <div
          class="peer relative ml-8 h-6 w-11 rounded-full bg-background-300 after:absolute after:left-[2px] after:top-[2px] after:h-5 after:w-5 after:rounded-full after:border after:border-gray-300 after:bg-background-50 after:transition-all after:content-[''] peer-checked:bg-background-600 peer-checked:after:translate-x-full peer-checked:after:border-white md:p-0"
        ></div>
        <span class="ms-2 hidden md:block">Theme</span>
      </label>

      <!-- Admin/User Logic -->
      @if (!isAdmin()) {
        <button (click)="logout()">Logout</button>
      } @else {
        <app-admin-dropdown></app-admin-dropdown>
      }
    </div>

    <!-- Hamburger and Mobile Dropdown Wrapper -->
    <div class="relative md:hidden">
      <!-- Hamburger (mobile only) -->
      <button
        class="inline-flex items-center justify-center rounded p-2 text-ink hover:bg-background-300"
        type="button"
        aria-label="Menu"
        [attr.aria-expanded]="mobileMenuOpen()"
        (click)="mobileMenuOpen.set(!mobileMenuOpen())"
      >
        <svg
          class="h-6 w-6"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            [attr.d]="
              mobileMenuOpen()
                ? 'M6 18L18 6M6 6l12 12'
                : 'M4 6h16M4 12h16M4 18h16'
            "
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
          />
        </svg>
      </button>

      <!-- Mobile Menu Dropdown -->
      @if (mobileMenuOpen()) {
        <div
          class="absolute right-0 mt-2 w-48 origin-top-right rounded-md bg-background-100 shadow-lg ring-1 ring-black ring-opacity-5 dark:bg-background-800"
        >
          <div class="py-1">
            @if (isAdmin()) {
              @for (link of navLinks; track link.route) {
                <a
                  class="block px-4 py-2 text-sm text-ink"
                  (click)="mobileMenuOpen.set(false)"
                  [class]="
                    isActive(link)
                      ? 'bg-primary font-medium text-primary-content'
                      : ''
                  "
                  [routerLink]="[link.route]"
                  [attr.aria-current]="isActive(link) ? 'page' : null"
                >
                  {{ link.label }}
                </a>
              }
            }
          </div>
        </div>
      }
    </div>
  </nav>
</div>
