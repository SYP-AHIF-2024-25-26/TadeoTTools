<form>
  <select
    id="divisions"
    aria-label="Division"
    [(ngModel)]="filterValue"
    (ngModelChange)="onFilterChange()"
    class="border-border-300 block w-full rounded-lg border bg-background-100 p-2.5 text-sm text-ink"
    name="divisions-select"
  >
    <option value="0" selected>All Divisions</option>

    @for (element of elements(); track element.id) {
      <option value="{{ element.id }}">{{ element.name }}</option>
    }
  </select>
</form>
