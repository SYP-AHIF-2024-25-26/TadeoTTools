server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Redirects stay relative, so they also work behind a path prefix
  # (Traefik strips /statistics before the request gets here).
  absolute_redirect off;

  # Bookmarks of the old app: /statistics/slideshow/<seconds> -> /statistics/?delay=<seconds>
  location ~ ^/slideshow/(\d+)$ {
    return 302 "../?delay=$1";
  }
  location ~ ^/slideshow/(\d+)/$ {
    return 302 "../../?delay=$1";
  }
  location = /slideshow {
    return 302 "./";
  }
  location /slideshow/ {
    return 302 "../";
  }

  location /assets/ {
    # If file not found, return 404 immediately, do NOT serve index.html
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html =404;
  }
}
