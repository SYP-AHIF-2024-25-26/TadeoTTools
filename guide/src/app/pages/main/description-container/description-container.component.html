<section class="rounded-2xl bg-white p-5 shadow-md ring-1 ring-gray-900/5">
  <div class="flex gap-4">
    <div class="flex min-w-0 flex-1 flex-col gap-3">
      @if (title() || (showRoom() && roomNr())) {
        <div>
          @if (title()) {
            <h2 class="break-words text-xl font-bold leading-7 text-gray-900">
              {{ title() }}
            </h2>
          }
          @if (showRoom() && roomNr()) {
            <p class="mt-1 text-base font-semibold text-gray-700">
              Raum {{ roomNr() }}
            </p>
          }
        </div>
      }
      @if (description()) {
        <div
          class="break-words text-lg leading-relaxed text-gray-700"
          [innerHTML]="description()"
        ></div>
      }
      @if (mapRoom()) {
        <a
          [routerLink]="['/map', mapRoom()]"
          class="mt-1 inline-flex h-11 items-center gap-2 self-start rounded-xl bg-accent-700 pl-4 pr-5 text-base font-bold text-white shadow-md transition hover:bg-accent-800 active:scale-[0.98]"
        >
          <svg
            class="h-5 w-5"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"
            />
          </svg>
          Auf der Karte
        </a>
      }
    </div>
  </div>
</section>
