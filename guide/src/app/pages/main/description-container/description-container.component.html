<!-- Plain text on the page sheet, deliberately not a card: cards are what you open and tick. -->
<section>
  <div class="flex gap-4">
    <div class="flex min-w-0 flex-1 flex-col gap-3">
      @if (title()) {
        <h2 class="break-words text-xl font-bold leading-7 text-gray-900">
          {{ title() }}
        </h2>
      }
      @if (description()) {
        <div
          class="description break-words text-lg leading-relaxed text-gray-700"
          [innerHTML]="html()"
        ></div>
      }
    </div>
    <!-- Optional side column on the right, e.g. a stop's division icons. -->
    <ng-content />
  </div>
</section>
