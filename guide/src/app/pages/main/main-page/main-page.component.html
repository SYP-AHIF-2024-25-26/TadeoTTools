<div
  class="flex min-h-screen w-full touch-pan-y touch-pinch-zoom select-none flex-col bg-canvas"
>
  <app-header size="start" title="Tag der offenen Tür">
    @if (dateLine()) {
      <p class="mt-2 text-lg font-semibold leading-snug text-night-100">
        {{ dateLine() }}
      </p>
    }
  </app-header>

  <main class="flex flex-col gap-3 px-4 pb-28 pt-5">
    @if (loadState() === 'loading') {
      <app-card-skeleton [count]="5" />
    } @else if (loadState() === 'error') {
      <app-load-error
        heading="Der Rundgang konnte nicht geladen werden"
        (retry)="onLoad()"
      />
    }
    @for (group of groups(); track group.id) {
      <app-guide-card
        [stopGroup]="group"
        [checked]="progress.isGroupSeen(group)"
        [progress]="progress.groupProgress(group)"
        [totalStops]="group.stopIds.length"
        [segments]="groupSegments().get(group.id) ?? []"
        (toggled)="progress.toggleGroup(group)"
        (open)="openStopPage(group)"
      />
    }
  </main>

  <div class="fixed bottom-0 left-0 right-0 z-20 mx-2">
    <app-navbar [mode]="'station'" />
  </div>
</div>
