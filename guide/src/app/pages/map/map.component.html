<div
  class="flex h-screen w-full touch-pan-y touch-pinch-zoom select-none flex-col justify-start overflow-y-scroll bg-canvas"
>
  <app-header title="Karte">
    @if (roomLabel(); as room) {
      <p class="mt-2 text-base font-semibold text-night-100">Raum {{ room }}</p>
    }
  </app-header>

  @if (roomNr() !== undefined) {
    <button
      class="mx-4 mt-5 flex h-11 w-fit items-center rounded-xl bg-accent-700 px-5 text-base font-bold text-white shadow-md transition hover:bg-accent-800 active:scale-[0.98]"
      (click)="onGoBack()"
    >
      Zur Station
    </button>
  }
  <div
    class="mx-4 mt-5 flex h-max flex-grow flex-col items-center justify-center rounded-2xl bg-white p-4 shadow-md ring-1 ring-gray-900/5"
  >
    <h2 class="self-start text-xl font-bold leading-7 text-gray-900">
      {{ currentFloorName() }}
    </h2>
    @for (floor of floors; track floor.image) {
      <div
        class="relative h-full max-h-[70vh] w-full max-w-md"
        [class.hidden]="currentFloor() !== $index"
      >
        <img
          [src]="floor.image"
          [alt]="'Plan ' + floor.name"
          class="h-full w-full object-contain"
        />
      </div>
    }
  </div>

  <!-- Changing floors is navigation, not an action: neutral like the stop pager. -->
  <div class="mb-28 mt-4 flex justify-evenly gap-4">
    <button
      (click)="navigate(1)"
      [disabled]="currentFloor() === floors.length - 1"
      aria-label="Stockwerk höher"
      class="flex h-11 items-center rounded-xl bg-white px-4 text-gray-900 shadow-md ring-1 ring-gray-900/5 transition active:scale-[0.98] disabled:bg-gray-100 disabled:text-gray-400 disabled:shadow-none disabled:active:scale-100"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="h-6 w-6"
        aria-hidden="true"
      >
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    </button>
    <button
      (click)="navigate(-1)"
      [disabled]="currentFloor() === 0"
      aria-label="Stockwerk tiefer"
      class="flex h-11 items-center rounded-xl bg-white px-4 text-gray-900 shadow-md ring-1 ring-gray-900/5 transition active:scale-[0.98] disabled:bg-gray-100 disabled:text-gray-400 disabled:shadow-none disabled:active:scale-100"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="h-6 w-6"
        aria-hidden="true"
      >
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
  </div>

  <div class="fixed bottom-0 left-0 right-0 z-10 mx-2">
    <app-navbar [mode]="'map'" />
  </div>
</div>
