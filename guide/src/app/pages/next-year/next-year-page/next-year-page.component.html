<!-- No list and no tab bar here, so the night frame fills the whole page. -->
<div class="on-night flex min-h-screen w-full flex-col bg-night-900 text-white">
  <app-header size="start" title="Tag der offenen Tür">
    @if (dateLine()) {
      <p class="mt-2 text-lg font-semibold leading-snug text-night-100">
        {{ dateLine() }}
      </p>
    }
  </app-header>

  <main class="flex flex-1 flex-col px-4 pb-8 pt-4">
    <!-- The countdown takes the free space and sits in its middle; the closing lines stay at the bottom. -->
    <section class="flex flex-1 flex-col justify-center py-2">
      @if (targetDate(); as date) {
        <p class="mb-4 text-xl font-bold leading-7">{{ greeting() }}</p>
        <app-countdown [targetDate]="date" />
        <!-- The four divisions in their exact colours, in the tour band's form. -->
        <div
          class="mt-6 flex h-3 gap-0.5 overflow-hidden rounded-full"
          aria-hidden="true"
        >
          <div class="flex-1 bg-informatic-blue"></div>
          <div class="flex-1 bg-media-technology-blue"></div>
          <div class="flex-1 bg-electronics-red"></div>
          <div class="flex-1 bg-medicin-technology-yellow"></div>
        </div>
      }
    </section>

    <p class="mt-4 text-xl font-bold leading-7">Wir freuen uns auf dich!</p>
    <a
      href="https://www.htl-leonding.at"
      target="_blank"
      rel="noopener noreferrer"
      class="-ml-1 mt-2 inline-flex min-h-11 items-center gap-2 self-start rounded-lg px-1 text-base font-semibold text-night-200 transition-colors hover:text-white"
    >
      Mehr auf htl-leonding.at
      <svg
        class="h-5 w-5 shrink-0"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M13.5 6H5.25A2.25 2.25 0 0 0 3 8.25v10.5A2.25 2.25 0 0 0 5.25 21h10.5A2.25 2.25 0 0 0 18 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"
        />
      </svg>
    </a>
  </main>
</div>
