<header class="flex items-start gap-6 px-6 pt-6 md:px-10">
  <div class="flex-1">
    <h1 class="text-3xl font-bold text-gray-800 md:text-4xl">Alles richtig?</h1>
    <p class="mt-2 text-xl text-gray-600">
      Zum Ändern einfach auf eine Antwort tippen.
    </p>
  </div>
  <button
    type="button"
    class="h-12 rounded-2xl px-4 text-lg font-medium text-gray-500 hover:bg-gray-100"
    (click)="confirmCancel.set(true)"
  >
    Abbrechen
  </button>
</header>

<main class="flex-1 overflow-y-auto px-6 py-8 md:px-10">
  <ul class="mx-auto flex max-w-4xl flex-col gap-3">
    @for (row of rows(); track row.id) {
      <li>
        <button
          type="button"
          class="flex w-full items-center gap-4 rounded-lg border-2 bg-white px-6 py-4 text-left shadow-lg hover:bg-gray-50"
          [class.border-red-600]="row.missing"
          [class.border-transparent]="!row.missing"
          (click)="session.edit(row.id)"
        >
          <span class="flex-1">
            <span class="block text-lg text-gray-600">{{ row.question }}</span>
            @if (row.answered) {
              <span class="mt-1 block text-xl font-medium text-gray-900">
                {{ row.answer }}
              </span>
            } @else if (row.missing) {
              <span class="mt-1 block text-xl font-medium text-red-700">
                Bitte beantworten
              </span>
            } @else {
              <span class="mt-1 block text-xl text-gray-500">
                Übersprungen
              </span>
            }
          </span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6 shrink-0 text-gray-400"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 5l7 7-7 7"
            />
          </svg>
        </button>
      </li>
    }
  </ul>
</main>

<footer class="flex items-center justify-between gap-4 px-6 pb-6 md:px-10">
  <button
    type="button"
    class="flex h-16 items-center gap-2 rounded-2xl bg-gray-500 pl-5 pr-7 text-xl font-medium text-white shadow-md hover:bg-gray-600"
    (click)="session.back()"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-6 w-6"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2.5"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M15 19l-7-7 7-7"
      />
    </svg>
    Zurück
  </button>

  <div class="flex items-center gap-4">
    @if (session.submissions().length === 0) {
      <p class="text-lg text-gray-600">Noch keine Frage beantwortet.</p>
    }
    <button
      type="button"
      class="flex h-16 items-center gap-2 rounded-2xl bg-orange-600 pl-7 pr-6 text-xl font-bold text-white shadow-md hover:bg-orange-700 disabled:opacity-50"
      [disabled]="!canSubmit()"
      (click)="session.submit()"
    >
      Absenden
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2.5"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M5 13l4 4L19 7"
        />
      </svg>
    </button>
  </div>
</footer>

@if (confirmCancel()) {
  <app-confirm-cancel-dialog
    (keep)="confirmCancel.set(false)"
    (discard)="discard()"
  />
}
